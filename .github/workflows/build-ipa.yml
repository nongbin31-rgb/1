name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main, master, ios15 ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16 (Classic iOS 18 SDK)
        run: |
          XCODE_16=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "${XCODE_16}" ]; then
            echo "Selecting ${XCODE_16}"
            sudo xcode-select -s "${XCODE_16}/Contents/Developer"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          brew install xcodegen

      - name: Fetch open-source upscaler engines (Waifu2x & Anime4K)
        run: bash scripts/fetch_vendor.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS Release (.app)
        run: |
          set -o pipefail
          xcodebuild \
            -project KedaOnlineReader.xcodeproj \
            -scheme KedaOnlineReader \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee xcodebuild.log || {
              echo "========== XCODEBUILD ERRORS =========="
              grep -E "(error:|fatal error:|BUILD FAILED)" xcodebuild.log | tail -n 30 | while IFS= read -r line; do
                echo "::error::$line"
              done
              exit 1
            }

      - name: Package Unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/KedaOnlineReader.app"
          test -d "${APP_PATH}"
          echo "=== Verifying Info.plist & LaunchScreen ==="
          plutil -p "${APP_PATH}/Info.plist"
          plutil -p "${APP_PATH}/Info.plist" | grep -q "UILaunchStoryboardName"
          test -d "${APP_PATH}/LaunchScreen.storyboardc"
          rm -rf Payload *.ipa
          mkdir -p Payload
          cp -R "${APP_PATH}" Payload/
          if [ "${GITHUB_REF_NAME}" = "ios15" ]; then
            IPA_NAME="KedaOnlineReader-iOS15-unsigned.ipa"
          else
            IPA_NAME="KedaOnlineReader-unsigned.ipa"
          fi
          zip -qry "${IPA_NAME}" Payload
          ls -lh "${IPA_NAME}"
          echo "IPA_NAME=${IPA_NAME}" >> $GITHUB_ENV

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ env.IPA_NAME }}
          retention-days: 30

      - name: Publish to GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${GITHUB_REF_NAME}" = "ios15" ]; then
            TAG="latest-ios15"
            TITLE="iOS 15 兼容版构建 (${GITHUB_SHA::7})"
            NOTES="自动构建的无签名 iOS 15+ 兼容版 IPA（提交 ${GITHUB_SHA::7}），最低支持 iOS 15.0 设备。"
          else
            TAG="latest"
            TITLE="Latest Build (${GITHUB_SHA::7})"
            NOTES="自动构建的无签名 iOS IPA（提交 ${GITHUB_SHA::7}），已适配全系全面屏 iPhone / iPad。"
          fi
          gh release delete "${TAG}" --yes 2>/dev/null || true
          git push origin ":refs/tags/${TAG}" 2>/dev/null || true
          gh release create "${TAG}" "${IPA_NAME}" \
            --title "${TITLE}" \
            --notes "${NOTES}"
