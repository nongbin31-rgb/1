name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch open-source upscaler engines (Waifu2x & Anime4K)
        run: bash scripts/fetch_vendor.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS Release (.app)
        run: |
          set -o pipefail
          xcodebuild \
            -project KedaOnlineReader.xcodeproj \
            -scheme KedaOnlineReader \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee xcodebuild.log || {
              echo "========== XCODEBUILD ERRORS =========="
              grep -E "(error:|fatal error:|BUILD FAILED)" xcodebuild.log | tail -n 30 | while IFS= read -r line; do
                echo "::error::$line"
              done
              exit 1
            }

      - name: Package Unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/KedaOnlineReader.app"
          test -d "${APP_PATH}"
          echo "=== Verifying Info.plist & LaunchScreen ==="
          plutil -p "${APP_PATH}/Info.plist"
          plutil -p "${APP_PATH}/Info.plist" | grep -q "UILaunchStoryboardName"
          test -d "${APP_PATH}/LaunchScreen.storyboardc"
          rm -rf Payload KedaOnlineReader-unsigned.ipa
          mkdir -p Payload
          cp -R "${APP_PATH}" Payload/
          zip -qry KedaOnlineReader-unsigned.ipa Payload
          ls -lh KedaOnlineReader-unsigned.ipa

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KedaOnlineReader-unsigned-ipa
          path: KedaOnlineReader-unsigned.ipa
          retention-days: 30

      - name: Publish to GitHub Release (latest)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest"
          gh release delete "${TAG}" --yes 2>/dev/null || true
          git push origin ":refs/tags/${TAG}" 2>/dev/null || true
          gh release create "${TAG}" KedaOnlineReader-unsigned.ipa \
            --title "Latest Build (${GITHUB_SHA::7})" \
            --notes "自动构建的无签名 iOS IPA（提交 ${GITHUB_SHA::7}），已适配全系全面屏 iPhone / iPad。"
