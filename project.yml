name: KedaOnlineReader
options:
  bundleIdPrefix: com.selfsigned
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.7.5

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  KedaOnlineReader:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleDisplayName: FristLove
        CFBundleLocalizations:
          - zh-Hans
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon
            CFBundleIconName: AppIcon
        CFBundleIcons~ipad:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon
            CFBundleIconName: AppIcon
        LSRequiresIPhoneOS: true
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Comic Book Archive
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.comicbook.cbz-archive
              - public.zip-archive
              - com.adobe.pdf
              - org.idpf.epub-container
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.comicbook.cbz-archive
            UTTypeDescription: Comic Book ZIP Archive
            UTTypeConformsTo:
              - public.zip-archive
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - cbz
          - UTTypeIdentifier: org.idpf.epub-container
            UTTypeDescription: EPUB Publication
            UTTypeConformsTo:
              - public.zip-archive
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - epub
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchStoryboardName: LaunchScreen
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: Sources/App
        excludes:
          - "Info.plist"
      - path: Sources/Models
      - path: Sources/Services
      - path: Sources/Views
      - path: Resources/Assets.xcassets
      - path: Resources/Anime4K_Shaders
        type: folder
        buildPhase: resources
      - path: Resources/Reader_Textures
        type: folder
        buildPhase: resources
      - path: Resources/Audio
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Frameworks/waifu2x.framework
        embed: true
        codeSign: false
      - package: SwiftSoup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.selfsigned.kedaonlinereader
        PRODUCT_NAME: KedaOnlineReader
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Frameworks"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@loader_path/Frameworks"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
