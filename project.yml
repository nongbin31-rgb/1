name: KedaOnlineReader
options:
  bundleIdPrefix: com.selfsigned
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  Waifu2xEngine:
    type: framework
    platform: iOS
    deploymentTarget: "16.0"
    info:
      path: Sources/Waifu2xEngine/Info.plist
    sources:
      - path: Vendor/Waifu2x
        excludes:
          - "**/*.h"
          - "**/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.selfsigned.kedaonlinereader.waifu2x
        PRODUCT_MODULE_NAME: Waifu2xEngine
        DEFINES_MODULE: YES
        COREML_CODEGEN_LANGUAGE: None
        SKIP_INSTALL: YES
        INSTALL_PATH: "@rpath"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@loader_path/Frameworks"
        SWIFT_SUPPRESS_WARNINGS: YES

  KedaOnlineReader:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    info:
      path: Sources/App/Info.plist
    sources:
      - path: Sources/App
        excludes:
          - "Info.plist"
      - path: Sources/Models
      - path: Sources/Services
      - path: Sources/Views
      - path: Vendor/Anime4KMetal
      - path: Vendor/Anime4K/glsl
        type: folder
        buildPhase: resources
    dependencies:
      - target: Waifu2xEngine
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.selfsigned.kedaonlinereader
        PRODUCT_NAME: KedaOnlineReader
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
